; Werte wie im bisherigen Image (Sulu braucht für die Bildgenerierung mehr RAM)
memory_limit = 512M
upload_max_filesize = 32M
post_max_size = 32M

expose_php = Off

; Code ist im Image fest, Dateien ändern sich zur Laufzeit nicht
opcache.enable = 1
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
realpath_cache_size = 4096K
realpath_cache_ttl = 600
